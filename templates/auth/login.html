{% extends "base.html" %}
{% block title %}Login - CTF Platform{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 text-neon mono text-sm tracking-widest mb-2">
        <span class="w-2 h-2 rounded-full bg-neon pulse-dot"></span> SYSTEM ONLINE
      </div>
      <h1 class="text-4xl font-bold text-white glow-text">CTF<span class="text-neon">//</span>PLATFORM</h1>
      <p class="text-slate-400 mt-2 text-sm">Capture The Flag &middot; MCQ &middot; Debugging Arena</p>
    </div>

    <form method="POST" class="bg-panel border border-border rounded-2xl p-8 glow-border">
      <div class="mb-5">
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Username / Register Number</label>
        <input type="text" name="username" required autofocus
          class="w-full bg-panel2 border border-border rounded-lg px-4 py-3 mono text-white focus:outline-none focus:border-neon transition"
          placeholder="e.g. 21CS045 or admin">
      </div>
      <div class="mb-6">
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Password</label>
        <input type="password" name="password" required
          class="w-full bg-panel2 border border-border rounded-lg px-4 py-3 mono text-white focus:outline-none focus:border-neon transition"
          placeholder="••••••••••">
      </div>
      <button type="submit"
        class="w-full bg-neon text-bg font-bold py-3 rounded-lg hover:brightness-110 transition tracking-wide">
        LOGIN
      </button>
    </form>

    <p class="text-center text-slate-600 text-xs mt-6 mono">One login for Admin &middot; Staff &middot; Student</p>
  </div>
</div>
{% endblock %}
