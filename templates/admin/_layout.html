{% extends "base.html" %}
{% block body %}
<div class="flex min-h-screen">
  <aside class="w-60 bg-panel border-r border-border p-5 hidden md:block">
    <div class="text-white font-bold text-lg mb-8">CTF<span class="text-neon">//</span>ADMIN</div>
    <nav class="space-y-1 text-sm">
      <a href="{{ url_for('admin.dashboard') }}" class="block px-3 py-2 rounded-lg hover:bg-panel2 text-slate-300">Dashboard</a>
      <a href="{{ url_for('admin.students') }}" class="block px-3 py-2 rounded-lg hover:bg-panel2 text-slate-300">Students</a>
      <a href="{{ url_for('admin.manage_staff') }}" class="block px-3 py-2 rounded-lg hover:bg-panel2 text-slate-300">Staff</a>
      <a href="{{ url_for('admin.categories') }}" class="block px-3 py-2 rounded-lg hover:bg-panel2 text-slate-300">Categories</a>
      <a href="{{ url_for('admin.challenges') }}" class="block px-3 py-2 rounded-lg hover:bg-panel2 text-slate-300">Challenges</a>
      <a href="{{ url_for('admin.anti_cheat') }}" class="block px-3 py-2 rounded-lg hover:bg-panel2 text-slate-300">Anti-Cheat Logs</a>
      <a href="{{ url_for('staff.chat_monitor') }}" class="block px-3 py-2 rounded-lg hover:bg-panel2 text-slate-300">Chat Monitor</a>
      <a href="{{ url_for('admin.settings') }}" class="block px-3 py-2 rounded-lg hover:bg-panel2 text-slate-300">Settings</a>
      <div class="pt-4 mt-4 border-t border-border">
        <a href="{{ url_for('auth.logout') }}" class="block px-3 py-2 rounded-lg hover:bg-panel2 text-slate-500">Logout</a>
      </div>
    </nav>
  </aside>
  <main class="flex-1 p-6 md:p-10">
    {% block admin_content %}{% endblock %}
  </main>
</div>
{% endblock %}
