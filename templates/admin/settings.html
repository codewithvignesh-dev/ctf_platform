{% extends "admin/_layout.html" %}
{% block title %}Settings{% endblock %}
{% block admin_content %}
<h1 class="text-2xl font-bold text-white mb-6">Event Settings</h1>

<form method="POST" class="bg-panel border border-border rounded-2xl p-6 max-w-xl space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <div class="text-white font-medium">Enable Event Chat</div>
      <div class="text-slate-500 text-sm">Lets students/staff message each other during the event.</div>
    </div>
    <input type="checkbox" name="chat_enabled" {{ 'checked' if settings.chat_enabled }} class="w-5 h-5 accent-emerald-400">
  </div>

  <div>
    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">MCQ Result Video (YouTube link, optional)</label>
    <input type="url" name="mcq_result_video_url" value="{{ settings.mcq_result_video_url }}" placeholder="https://youtube.com/watch?v=..."
      class="w-full bg-panel2 border border-border rounded-lg px-4 py-3 mono text-white text-sm focus:outline-none focus:border-neon">
    <p class="text-slate-600 text-xs mt-1">If empty, students go straight to their MCQ result.</p>
  </div>

  <div>
    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Background Music (YouTube link, optional)</label>
    <input type="url" name="mcq_bgm_url" value="{{ settings.mcq_bgm_url }}" placeholder="https://youtube.com/watch?v=..."
      class="w-full bg-panel2 border border-border rounded-lg px-4 py-3 mono text-white text-sm focus:outline-none focus:border-neon">
  </div>

  <button class="bg-neon text-bg font-bold px-6 py-3 rounded-lg hover:brightness-110">Save Settings</button>
</form>
{% endblock %}
